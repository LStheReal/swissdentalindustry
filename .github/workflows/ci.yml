name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Server- und DB-abhängige Suiten überspringen sich ohne Dev-Server bzw.
      # ohne .env.local selbst (tests/setup.ts). Unit-, Security-, Migrations-
      # und Prod-Smoke-Tests laufen hier und blockieren jeden Push/PR.
      - run: npm test
      - run: npm run build
